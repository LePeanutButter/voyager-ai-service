# ===========================================
# CI — AI Service (push a development)
# - Trivy + SonarCloud (ORGANIZATION_KEY, PROJECT_KEY, SONAR_TOKEN)
# - Build optimizado: requirements split (runtime vs dev), torch CPU-only,
#   buildx GHA cache, artefacto comprimido (.tar.gz).
# ===========================================

name: CI Build & Deploy (AI Service - Development Push)

on:
  push:
    branches:
      - development
  workflow_dispatch:

jobs:
  trivy_scan:
    name: Run Trivy Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y wget apt-transport-https gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -qq
          sudo apt-get install -y trivy

      - name: Run Trivy FS Scan
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          skip-setup-trivy: 'true'

  sonar_scan:
    name: SonarCloud Analysis (Python)
    needs: trivy_scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies (runtime + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests with coverage for Sonar
        run: |
          if [ -d "tests" ]; then
            coverage run -m pytest
            coverage xml -o coverage.xml
          else
            echo "No tests directory found; creating empty coverage.xml for Sonar."
            printf '%s\n' '<?xml version="1.0" ?><coverage version="7.0.0" timestamp="0" lines-valid="0" lines-covered="0" line-rate="0" branches-valid="0" branches-covered="0" branch-rate="0" complexity="0"><sources><source>.</source></sources><packages></packages></coverage>' > coverage.xml
          fi

      - name: Validate coverage report exists
        run: |
          test -f coverage.xml
          ls -lah coverage.xml

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ secrets.ORGANIZATION_KEY }}
            -Dsonar.projectKey=${{ secrets.PROJECT_KEY }}
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.scm.disabled=true
            -Dsonar.branch.name=development
            -Dsonar.branch.target=main

  build_and_test:
    name: Build & Test (Python)
    needs: sonar_scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dev dependencies (testing)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run unit tests
        run: |
          if [ -d "tests" ]; then
            pytest
          else
            echo "No tests directory found, skipping tests."
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build con caché de BuildKit en el caché de Actions. La primera build de
      # development no la aprovecha; las siguientes saltan ~5–7 min.
      - name: Build Docker image (FastAPI, runtime slim)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: voyager-ai-service:latest
          cache-from: type=gha,scope=ai-service-development
          cache-to: type=gha,mode=max,scope=ai-service-development

      - name: Save & compress image for Learner Lab
        run: |
          mkdir -p release
          # docker save | gzip reduce ~50% el tamaño del artefacto.
          docker save voyager-ai-service:latest | gzip -9 > release/voyager-ai-service-image.tar.gz
          ls -lh release/voyager-ai-service-image.tar.gz

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-service-docker-image
          path: release/voyager-ai-service-image.tar.gz

  deploy_ec2:
    if: github.event_name == 'push'
    name: Deploy to EC2 (Development)
    needs: build_and_test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make deploy script executable
        run: chmod +x scripts/ec2-deploy-ai-service.sh

      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: ai-service-docker-image
          path: release

      - name: Generate environment file
        run: |
          cat > environment << EOF
          # Database configuration (RDS PostgreSQL)
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=${{ secrets.DB_PORT }}
          DB_NAME=${{ secrets.DB_NAME }}
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_SSLMODE=${{ secrets.DB_SSLMODE }}
          PGSSLMODE=${{ secrets.DB_SSLMODE }}

          # AI/ML — Ollama corre en la misma EC2 vía Docker network "ai_net".
          # phi3:3.8b ~ 2.3 GB, ~2x más rápido que mistral:7b en CPU sin perder
          # demasiado en español. Cambia a mistral:7b-instruct si necesitas
          # más calidad y aceptas el coste de tokens/seg.
          OLLAMA_URL=http://ollama:11434
          LOCAL_MODEL_NAME=phi3:3.8b
          OLLAMA_HTTP_TIMEOUT_SECONDS=300
          OLLAMA_PULL_ON_START=1

          # CORS / service config
          ALLOWED_ORIGINS=${{ secrets.ALLOWED_ORIGINS }}

          # Fixed values
          AI_HOST_PORT=8000
          CORS_ALLOW_EC2_COMPUTE_DNS=false
          LOG_LEVEL=INFO
          VOYAGER_AI_IMAGE=voyager-ai-service:latest
          EOF

      - name: Upload manual deployment package
        uses: actions/upload-artifact@v4
        with:
          name: ai-service-ec2-deploy
          path: |
            release/voyager-ai-service-image.tar.gz
            scripts/ec2-deploy-ai-service.sh
            environment
