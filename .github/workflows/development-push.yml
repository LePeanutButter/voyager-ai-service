# ===========================================
# GitHub Actions Workflow: CI Build & Deploy
# Environment: Development
# Description:
#   - Installs dependencies and runs optional unit tests for AI service
#   - Performs Trivy security scan and SonarCloud static analysis
#   - Packages AI service artifact for manual Learner Lab deployment
#   - Runs on every push to 'development'
# ===========================================

name: CI Build & Deploy (AI Service - Development Push)

# -------------------------------------------
# Trigger: Run workflow on push to 'development' branch
# -------------------------------------------
on:
  push:
    branches:
      - development
  workflow_dispatch:

# -------------------------------------------
# Jobs Definition
# -------------------------------------------
jobs:
  # =========================================
  # Job: Security Scan (Trivy)
  # Purpose: Scan filesystem and dependencies for vulnerabilities
  # =========================================
  trivy_scan:
    name: Run Trivy Security Scan
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Run Trivy filesystem scan
      - name: Run Trivy FS Scan
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

  # =========================================
  # Job: SonarCloud Scan
  # Purpose: Run static code analysis with SonarCloud
  # =========================================
  sonar_scan:
    name: SonarCloud Analysis (Python)
    needs: trivy_scan
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 2: Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Run SonarCloud scan
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # =========================================
  # Job: Build & Test Stage
  # Purpose: Build and package AI service
  # =========================================
  build_and_test:
    name: Build & Test (Python)
    needs: sonar_scan
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      # Step 4: Run unit tests
      - name: Run unit tests
        run: |
          if [ -d "tests" ]; then
            pytest
          else
            echo "No tests directory found, skipping tests."
          fi

      # Step 5: Package AI service
      - name: Package AI service
        run: |
          mkdir -p release
          tar -czf release/ai-service.tar.gz app requirements.txt

      # Step 6: Upload artifact
      - name: Upload AI service artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-service-package
          path: release/ai-service.tar.gz

  # =========================================
  # Job: Deploy Stage (Manual)
  # Purpose: Manual Learner Lab deployment handoff
  # =========================================
  deploy:
    if: github.event_name == 'push'
    name: Deploy Handoff (Manual Learner Lab)
    needs: build_and_test
    runs-on: ubuntu-latest
    steps:
      # Step 1: Download build artifact
      - name: Download AI service artifact
        uses: actions/download-artifact@v4
        with:
          name: ai-service-package
          path: release

      # Step 2: Upload manual deployment package
      - name: Upload manual deployment package
        uses: actions/upload-artifact@v4
        with:
          name: ai-service-manual-deploy
          path: |
            release/ai-service.tar.gz
            scripts/deploy-ai-service-manual.sh
