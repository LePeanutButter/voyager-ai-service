# ===========================================
# CI — AI Service (PR a development)
# - Trivy + SonarCloud (ORGANIZATION_KEY, PROJECT_KEY, SONAR_TOKEN)
# - Artefactos: API (endpoints) y bundle ML
# ===========================================

name: CI Build & Deploy (AI Service - Development PR)

on:
  pull_request:
    branches:
      - development
  workflow_dispatch:

jobs:
  trivy_scan:
    name: Run Trivy Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y wget apt-transport-https gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -qq
          sudo apt-get install -y trivy

      - name: Run Trivy FS Scan
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          skip-setup-trivy: 'true'

  sonar_scan:
    name: SonarCloud Analysis (Python)
    needs: trivy_scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies (runtime + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests with coverage for Sonar
        run: |
          if [ -d "tests" ]; then
            coverage run -m pytest
            coverage xml -o coverage.xml
          else
            echo "No tests directory found; creating empty coverage.xml for Sonar."
            printf '%s\n' '<?xml version="1.0" ?><coverage version="7.0.0" timestamp="0" lines-valid="0" lines-covered="0" line-rate="0" branches-valid="0" branches-covered="0" branch-rate="0" complexity="0"><sources><source>.</source></sources><packages></packages></coverage>' > coverage.xml
          fi

      - name: Validate coverage report exists
        run: |
          test -f coverage.xml
          ls -lah coverage.xml

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ secrets.ORGANIZATION_KEY }}
            -Dsonar.projectKey=${{ secrets.PROJECT_KEY }}
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.scm.disabled=true
            -Dsonar.pullrequest.key=${{ github.event.number }}
            -Dsonar.pullrequest.branch=${{ github.head_ref }}
            -Dsonar.pullrequest.base=${{ github.base_ref }}
            -Dsonar.scm.revision=${{ github.event.pull_request.head.sha }}

  build:
    name: Build & Test (Python)
    needs: sonar_scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dev dependencies (testing)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run unit tests
        run: |
          if [ -d "tests" ]; then
            pytest
          else
            echo "No tests directory found, skipping tests."
          fi

      - name: Package API (sin pesos en app/ml/models)
        run: |
          mkdir -p release
          STAGE=$(mktemp -d)
          cp -r app "${STAGE}/"
          rm -rf "${STAGE}/app/ml/models"
          mkdir -p "${STAGE}/app/ml/models"
          cp requirements.txt Dockerfile "${STAGE}/"
          tar -czf release/ai-service-api.tar.gz -C "${STAGE}" .
          rm -rf "${STAGE}"

      - name: Package ML models bundle
        run: |
          mkdir -p release
          if [ -d app/ml/models ] && [ -n "$(find app/ml/models -type f 2>/dev/null | head -1)" ]; then
            tar -czf release/ml-models.tar.gz -C app/ml models
          else
            mkdir -p release/ml-models-placeholder
            printf '%s\n' '{"note":"Sin binarios en repo; usar artefactos de entrenamiento o el bundle ml-models del CI en EC2."}' > release/ml-models-placeholder/manifest.json
            tar -czf release/ml-models.tar.gz -C release ml-models-placeholder
          fi

      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-service-api
          path: release/ai-service-api.tar.gz

      - name: Upload ML bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-service-ml-models
          path: release/ml-models.tar.gz
