# ===========================================
# GitHub Actions Workflow: CI Build & Deploy
# Environment: Development
# Description:
# - **Continuous Integration (CI)**: Executes Python checks and optional tests.
# - **Security**: Runs **Trivy FS scan** to detect vulnerabilities in dependencies and source.
# - **Static Analysis**: Runs SonarCloud analysis adapted for Python.
# - **Continuous Delivery Prep**: Publishes AI service package artifact for manual deployment.
# - **Trigger**: Runs automatically on every **pull request** targeting the 'development' branch.
# ===========================================

name: CI Build & Deploy (AI Service - Development PR)

# -------------------------------------------
# Trigger: Run workflow on PR to 'development' branch
# -------------------------------------------
on:
  pull_request:
    branches:
      - development
  workflow_dispatch:

# -------------------------------------------
# Jobs Definition
# -------------------------------------------
jobs:
  # =========================================
  # Job: Security Scan (Trivy)
  # Purpose: Scan filesystem and dependencies for vulnerabilities
  # =========================================
  trivy_scan:
    name: Run Trivy Security Scan
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Run Trivy filesystem scan
      - name: Run Trivy FS Scan
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

  # =========================================
  # Job: SonarCloud Scan
  # Purpose: Run static code analysis with SonarCloud
  # =========================================
  sonar_scan:
    name: SonarCloud Analysis (Python)
    needs: trivy_scan
    runs-on: ubuntu-latest
    steps:
    # Step 1: Checkout source code
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
          fetch-depth: 0

    # Step 2: Setup Python
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
          python-version: '3.11'

    # Step 3: Install dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # Step 4: Run SonarCloud scan
    - name: SonarCloud Scan
      uses: SonarSource/sonarcloud-github-action@v2
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # =========================================
  # Job: Build Stage
  # Purpose: Install dependencies, run optional tests and package AI service
  # =========================================
  build:
    name: Build & Test (Python)
    needs: sonar_scan
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      # Step 4: Run unit tests (if tests directory exists)
      - name: Run unit tests
        run: |
          if [ -d "tests" ]; then
            pytest
          else
            echo "No tests directory found, skipping tests."
          fi

      # Step 5: Package service artifact
      - name: Package AI service
        run: |
          mkdir -p release
          tar -czf release/ai-service.tar.gz app requirements.txt

      # Step 6: Upload artifact
      - name: Upload AI service artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-service-package
          path: release/ai-service.tar.gz
